<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para você 💜</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Georgia, "Times New Roman", serif;
      color: #f7f3ff;

      background:
        radial-gradient(circle at 50% 20%, rgba(92, 76, 150, 0.28), transparent 30%),
        linear-gradient(180deg, #050914 0%, #080d1f 55%, #11112b 100%);
    }

    .scene {
      position: relative;
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }

    /* ESTRELAS */

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(circle at 8% 15%, #ffffff 1px, transparent 1.5px),
        radial-gradient(circle at 18% 72%, #d9d0ff 1px, transparent 1.5px),
        radial-gradient(circle at 27% 31%, #ffffff 1.2px, transparent 1.7px),
        radial-gradient(circle at 39% 12%, #d9d0ff 1px, transparent 1.5px),
        radial-gradient(circle at 48% 82%, #ffffff 1px, transparent 1.5px),
        radial-gradient(circle at 58% 27%, #d9d0ff 1px, transparent 1.5px),
        radial-gradient(circle at 67% 67%, #ffffff 1.2px, transparent 1.7px),
        radial-gradient(circle at 78% 18%, #d9d0ff 1px, transparent 1.5px),
        radial-gradient(circle at 88% 55%, #ffffff 1px, transparent 1.5px),
        radial-gradient(circle at 94% 25%, #d9d0ff 1px, transparent 1.5px);

      opacity: 0.75;
    }

    /* CONTEÚDO */

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 520px;

      text-align: center;
    }

    /* LUA */

    .moon {
      width: 82px;
      height: 82px;

      margin: 0 auto 28px;

      border-radius: 50%;

      background: #eeeaff;

      box-shadow:
        0 0 18px rgba(238, 234, 255, 0.35),
        0 0 45px rgba(181, 163, 255, 0.18);

      position: relative;
    }

    .moon::after {
      content: "";

      position: absolute;

      width: 82px;
      height: 82px;

      border-radius: 50%;

      background: #080d1f;

      left: 22px;
      top: -8px;
    }

    /* TEXTOS */

    .eyebrow {
      margin-bottom: 13px;

      color: #b9a9e9;

      font-size: 1.15rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 14px;

      font-size: clamp(1.35rem, 5vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.04em;

      text-shadow:
        0 0 18px rgba(190, 174, 255, 0.25);
    }

    .subtitle {
      max-width: 390px;

      margin: 0 auto 32px;

      color: #ded8ef;

      font-size: 1.25rem;
      line-height: 1.7;
    }

    /* BOTÕES */

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;

      flex-wrap: wrap;
    }

    button {
     
  min-width: 110px;
  max-width: 210px;

  padding: 12px 16px;

      border: 1px solid rgba(201, 188, 255, 0.45);
      border-radius: 999px;

      background: rgba(22, 20, 50, 0.75);

      color: #f7f3ff;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;

      cursor: pointer;

      box-shadow:
        0 0 18px rgba(157, 135, 226, 0.12);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);

      background: rgba(48, 41, 87, 0.9);

      box-shadow:
        0 0 25px rgba(157, 135, 226, 0.25);
    }

    .tiny {
      margin-top: 28px;

      color: rgba(222, 216, 239, 0.75);

      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="content">

      <div class="moon"></div>

      <div class="eyebrow">
        Minha nossa! Você me encontrou aqui, vejo que busca respostas.
      </div>

      <h1>
        Sou o Suriel, um ser antigo.
      </h1>

      <p class="subtitle">
        Você veio me procurar para descobrir o que ela preparou para você?
      </p>

      <div class="buttons">
        <button id="sim">SIM ✦</button>
        <button id="nao">NÃO ✦</button>
      </div>

      <div class="tiny">
        ✦ Você só poderá abrir este presente se for o parceiro dela. ✦
      </div>

    </div>

  </div>


  <script>

    const sim = document.getElementById("sim");
    const nao = document.getElementById("nao");

    const eyebrow = document.querySelector(".eyebrow");
    const title = document.querySelector("h1");
    const subtitle = document.querySelector(".subtitle");
    const tiny = document.querySelector(".tiny");


    /*
      ETAPAS DO PRESENTE

      inicio
      entrada
      provaCCBB
      respostaCCBB
      laco
      lingua
    */

    let etapa = "inicio";


    function mostrar(texto, titulo, descricao, textoSim, textoNao, textoPequeno) {

      eyebrow.textContent = texto;
      title.textContent = titulo;
      subtitle.textContent = descricao;

      sim.textContent = textoSim;

      if (textoNao === null) {
        nao.style.display = "none";
      } else {
        nao.style.display = "inline-block";
        nao.textContent = textoNao;
      }

      tiny.textContent = textoPequeno;
    }


    /* =========================
       BOTÃO SIM
       ========================= */

    sim.addEventListener("click", function() {


      /* TELA INICIAL */

      if (etapa === "inicio") {

        mostrar(
          "Vejo que não fugiu do seu destino.",
          "Muito bem, parceiro dela.",
          "Mas ainda precisará provar que é digno de abrir este presente.",
          "CONTINUAR ✦",
          null,
          "✦ O Suriel observa em silêncio. ✦"
        );

        etapa = "entrada";

        return;
      }


      /* ENTRADA DA PRIMEIRA PROVA */

    if (etapa === "entrada") {

  mostrar(
    "Feche os olhos e sinta o seu coração.",
    "Procure o laço da parceria.",
    "Leve-o com você, humano. Se realmente o tiver.",
    "CONTINUAR ✦",
    null,
    "✦ O Suriel observa em silêncio. ✦"
  );

  etapa = "lacoParceria";

  return;
}


if (etapa === "lacoParceria") {

  mostrar(
  "A primeira prova começa agora.",
  "O laço da parceria.",
  "Houve um momento em que ela percebeu que havia algo diferente entre vocês. Em qual desses encontros ela sentiu o laço da parceria?",
  "O ENCONTRO NO CENTRO CULTURAL ✦",
  "A NOITE NO SKY BAR ✦",
  "✦ Pense bem, parceiro dela. O Suriel não costuma repetir perguntas. ✦"
);

  etapa = "provaCCBB";

  return;
}


      /* RESPOSTA CORRETA: CCBB */

      if (etapa === "provaCCBB") {

        mostrar(
          "Interessante...",
          "Você se lembra.",
          "Foi no carro, depois do CCBB, que ela percebeu que havia algo diferente entre vocês. Antes de vocês se sentirem um casal.",
          "CONTINUAR ✦",
          null,
          "✦ Não disse que não teria pegadinhas, humano... Talvez você seja mesmo o parceiro dela. ✦"
        );

        etapa = "respostaCCBB";

        return;
      }


      /* PRIMEIRO LAÇO */

      /* SEGUNDA PARTE — AS BATALHAS */

if (etapa === "respostaCCBB") {

  mostrar(
    "O Suriel o observa em silêncio.",
    "Encontrar o laço foi apenas o começo.",
    "Depois de se reconhecerem, vieram as diferenças. Dois mundos diferentes, dois jeitos diferentes de enxergar a vida. E, ainda assim, vocês continuaram escolhendo um ao outro.",
    "CONTINUAR ✦",
    null,
    "✦ Algumas batalhas não são vencidas contra um inimigo, mas dentro de nós mesmos. ✦"
  );

  etapa = "batalhas";

  return;
}


/* PREPARAÇÃO PARA A SEGUNDA PROVA */

if (etapa === "batalhas") {

  mostrar(
    "O Suriel inclina a cabeça.",
    "Vocês aprenderam um com o outro.",
    "Mas me diga, humano. A maior batalha não foi a externa, foi? O que foi mais difícil para vocês?",
    "APRENDER A IGNORAR A REJEIÇÃO E A INVEJA DOS OUTROS ✦",
    "APRENDER A CONFIAR NA MUDANÇA E NA MELHORA UM DO OUTRO ✦",
    "✦ Algumas respostas só podem ser encontradas por quem realmente viveu a história. ✦"
  );

  etapa = "provaLicoes";

  return;
}
if (etapa === "provaLicoes") {

  mostrar(
    "O Suriel inclina a cabeça.",
    "Não exatamente.",
    "Houve coisas e pessoas de fora que interferiram no caminho de vocês. Mas essa não foi a maior batalha. A verdadeira mudança aconteceu quando cada um começou a olhar para si mesmo.",
    "TENTAR NOVAMENTE ✦",
    null,
    "✦ O Suriel ainda espera a resposta certa. ✦"
  );

  etapa = "batalhas";

  return;
}
if (etapa === "depoisLicoes") {

  mostrar(
    "O Suriel permanece em silêncio por alguns instantes.",
    "Talvez o laço seja mais forte do que parece.",
    "Vocês são diferentes. Sempre foram. Mas, mesmo depois das batalhas, continuaram encontrando um no outro aquilo que precisavam para seguir em frente.",
    "CONTINUAR ✦",
    null,
    "✦ Nem todo laço é feito para tornar duas pessoas iguais. Alguns existem para fazê-las crescer. ✦"
  );

  etapa = "proximaParte";

  return;
}
            if (etapa === "proximaParte") {

        mostrar(
          "Mas o Suriel se lembra de algo anterior a tudo isso.",
          "Antes do laço, houve apenas vocês.",
          "Antes das batalhas, antes das mudanças e até antes de saberem o que seriam um para o outro, houve um dia em que vocês simplesmente riram. Entre tantas pessoas, por alguns instantes, parecia que só existiam vocês dois.",
          "CONTINUAR ✦",
          null,
          "✦ Algumas das histórias mais importantes começam antes de sabermos que estamos vivendo o começo de alguma coisa. ✦"
        );

        etapa = "memoriaClube";

        return;
      }
      if (etapa === "memoriaClube") {

        mostrar(
          "O Suriel observa uma lembrança distante.",
          "O Clube da Stella.",
          "Havia muita gente. Seu irmão, os irmãos dela, os amigos deles por todos os lados. Mas, enquanto jogavam badminton e riam um do outro, vocês encontraram um pequeno mundo só de vocês.",
          "CONTINUAR ✦",
          null,
          "✦ Naquele dia, vocês ainda não sabiam o que estavam começando. ✦"
        );

        etapa = "memoriaMusica";

        return;
      }
            if (etapa === "memoriaMusica") {

        mostrar(
          "O Suriel sorri ao se lembrar.",
          "E aquela música?",
          "Quando “More Than a Feeling” se tornou parte da memória de vocês, o que vocês estavam fazendo?",
          "CONVERSANDO SOZINHOS EM ALGUM CANTO, LONGE DE TODOS. ✦",
          "JOGANDO BADMINTON, RINDO UM DO OUTRO E DE TUDO AO REDOR. ✦",
          "✦ Algumas lembranças são realmente fora de série. ✦"
        );

        etapa = "provaMusica";

        return;
      }
            if (etapa === "depoisMusica") {

        mostrar(
          "O Suriel permanece em silêncio por um instante.",
          "Talvez tenha sido ali.",
          "Antes de vocês saberem o que seriam um para o outro, antes das batalhas e antes de precisarem aprender a mudar, existiu aquele pequeno instante em que tudo parecia simples.",
          "CONTINUAR ✦",
          null,
          "✦ Às vezes, o começo de uma história não parece importante enquanto está acontecendo. ✦"
        );

        etapa = "proximaParte2";

        return;
      }
  

    });


    /* =========================
       BOTÃO NÃO
       ========================= */

    nao.addEventListener("click", function() {


      /* NÃO NA TELA INICIAL */

      if (etapa === "inicio") {

        mostrar(
          "O Suriel ergue uma sobrancelha.",
          "Tem certeza disso?",
          "Você veio até aqui para descobrir o que ela preparou e agora pretende recuar?",
          "EU SOU O PARCEIRO DELA",
          "VOLTAR ✦",
          "✦ O destino não costuma aceitar um simples \"não\". ✦"
        );

        etapa = "inicioNao";

        return;
      }


      /* VOLTAR PARA O SIM */

      if (etapa === "inicioNao") {

        mostrar(
          "O Suriel ergue uma sobrancelha.",
          "Muito bem.",
          "Parece que finalmente decidiu enfrentar o seu destino.",
          "EU SOU O PARCEIRO DELA",
          "VOLTAR ✦",
          "✦ Agora escolha com sabedoria, humano. ✦"
        );

        etapa = "inicioNao2";

        return;
      }


      /* SE CLICAR NO SKY BAR */

      if (etapa === "provaCCBB") {

        mostrar(
          "O Suriel inclina a cabeça.",
          "Não exatamente.",
          "A noite no Sky Bar foi o momento em que vocês se sentiram como um casal. Mas não foi quando ela sentiu o laço da parceria.",
          "O ENCONTRO NO CCBB ✦",
          "TENTAR NOVAMENTE ✦",
          "✦ Algumas histórias, humano... começam antes de percebermos que começaram. ✦"
        );

        /*
          Continuamos na mesma etapa.
          Assim, o botão CCBB continua sendo a resposta correta.
        */

        return;
      }
if (etapa === "provaLicoes") {

  mostrar(
    "O Suriel sorri de canto.",
    "Agora você entendeu.",
    "Vocês não precisaram se tornar iguais. Precisaram aprender a confiar que ambos poderiam mudar, crescer e se tornar pessoas melhores. Por vocês mesmos e também um pelo outro.",
    "CONTINUAR ✦",
    null,
    "✦ Algumas batalhas são vencidas quando se escolhe crescer, mesmo quando seria mais fácil permanecer como antes. ✦"
  );

  etapa = "depoisLicoes";

  return;
}
if (etapa === "depoisLicoes") {

  mostrar(
    "O Suriel permanece em silêncio por alguns instantes.",
    "Talvez o laço seja mais forte do que parece.",
    "Vocês são diferentes. Sempre foram. Mas, mesmo depois das batalhas, continuaram encontrando um no outro aquilo que precisavam para seguir em frente.",
    "CONTINUAR ✦",
    null,
    "✦ Nem todo laço é feito para tornar duas pessoas iguais. Alguns existem para fazê-las crescer. ✦"
  );

  etapa = "proximaParte";

  return;
}
      /* RESPOSTA ERRADA DA LÍNGUA */

            if (etapa === "provaMusica") {

        mostrar(
          "O Suriel sorri.",
          "Sim. Era isso.",
          "Não havia promessas. Não havia certezas. Não havia ainda o laço que você precisou provar, nem as batalhas que precisaram enfrentar. Havia apenas dois desconhecidos rindo como se fossem amigos há décadas.",
          "CONTINUAR ✦",
          null,
          "✦ Talvez aquele tenha sido o verdadeiro começo. ✦"
        );

        etapa = "depoisMusica";

        return;
      }

    });

  </script>

</body>
</html>
